name: ✨ 功能建议
description: 建议新增规则、生态或命令能力
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 [docs/requirements.md](https://github.com/demo-zexuan/devenv-cleaner/blob/main/docs/requirements.md)
        的「边界与不做的事」一节：被明确排除的能力（例如自动上传遥测、按文件粒度删除）不会实现。
        如果你要提的是「新增一个可清理目录」，下面「建议类型」请选对应的那两项之一。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 描述场景与当前做法，不要只写期望的方案。说明现在必须手工怎么做、代价是什么。
      placeholder: 例如：我们的 monorepo 用 Turborepo，每次清理都要手工找 .turbo 目录。
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新增一条清理规则（已有生态，新目录形态）
        - 新增一个生态（新语言 / 新包管理器）
        - 改进扫描、度量或去重行为
        - 改进 TUI 交互或筛选
        - 改进报告导出或 diff 门禁
        - 配置项 / CLI 参数
        - 其他（请在问题描述中说明）
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 具体到命令行与输出。如果涉及规则，请给出目录名、匹配路径示例，以及它属于哪个层级（dependencies / build / cache / artifacts）。
      placeholder: |
        规则 id: node-turbo-cache
        匹配: **/.turbo
        层级: cache
        风险: low
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: 删除安全性说明
      description: 这个目录删掉之后如何恢复？是否需要重建命令、是否依赖网络、是否可能包含不可再生的产物？如果不可再生，请说明为什么它应该被删除而不是仅报告。
    validations:
      required: true

  - type: input
    id: scale
    attributes:
      label: 典型占用规模
      description: 可选。这个目录在你机器上通常多大？规模决定了默认风险与是否需要体积升级策略。
      placeholder: 例如：单项目 2–8 GB
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 可选。现有配置（rules.<id> 覆盖、whitelist、limits）能否达到同样效果？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认该能力不在 requirements.md 的「不做的事」清单里。
          required: true
        - label: 我已搜索过现有 issue 与 `dvc rules list`，没有同名规则或生态。
          required: true
