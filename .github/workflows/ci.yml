# Continuous integration for DevEnvClean.
#
# Three jobs, deliberately separate so a failure names the thing that broke:
#
#   1. `check`   — the test gate, on two platforms via one matrix.
#   2. `package` — proves the *publishable artifact* works, not just the source.
#
# Why two platforms: DevEnvClean is macOS/Linux first, and macOS is where the
# path-safety logic genuinely differs — `/tmp` is a symlink to `/private/tmp`,
# so `isProtectedResolvedPath` and the alias allowance in `src/core/platform.ts`
# only get real coverage there. The reverse also holds: the case-folding and
# `/tmp`-alias assumptions that a macOS-only suite silently bakes in are caught
# only on Linux.
#
# Why an artifact job: every other job imports `src/**` directly. A path missing
# from the `files` field, a dependency left in `devDependencies`, or a lost
# shebang is invisible to them and breaks only for a consumer.
#
# The pnpm version comes from the `packageManager` field in `package.json`, which
# `pnpm/action-setup` reads, so the runner cannot drift from the toolchain that
# produced the committed lockfile.

name: CI

on:
  push:
  pull_request:

# A superseded push is no longer interesting. Cancel the older run so at most
# one run per ref occupies a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only checkout is all this workflow needs; it never publishes.
permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report both platforms even when one fails, otherwise a macOS-only
      # failure hides behind a Linux failure and vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux / full gate
            fullGate: true
          - os: macos-latest
            name: macOS / tests
            fullGate: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Reuses the pnpm store between runs; requires pnpm to be installed
          # first, which is why this step follows `pnpm/action-setup`.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: matrix.fullGate
        run: pnpm typecheck

      - name: Lint
        if: matrix.fullGate
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        if: matrix.fullGate
        run: pnpm build

  package:
    name: Package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Packs the tarball, inspects its contents, then installs it into a
      # throwaway project and runs the real binary. This is the only job that
      # exercises what a user actually downloads.
      - name: Verify the publishable artifact
        run: pnpm verify:package
