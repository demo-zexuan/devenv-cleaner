# Release: run the full check gate and publish to npm on a `v*` tag.
#
# Triggering is deliberately narrow — `push` on a `v*` tag only — and every
# publishing step additionally asserts `startsWith(github.ref, 'refs/tags/v')`,
# so a `workflow_dispatch` run on a branch exercises the gate without touching
# the registry.
#
# Provenance note: `--provenance` is intentionally NOT used here. npm's
# attestation requires a `repository` field in `package.json`, and this package
# does not declare one yet, so the flag would fail the publish. Because nothing
# needs an OIDC token, `id-token` is not requested either and the workflow keeps
# the single `contents: read` permission.
#
# The pnpm version is pinned because `package.json` carries no `packageManager`
# field for `pnpm/action-setup` to read. It matches the toolchain that produced
# the committed lockfile and the `allowBuilds: esbuild: true` approval in
# `pnpm-workspace.yaml`; an older pnpm ignores that field and blocks esbuild's
# postinstall, which breaks `pnpm build` and `pnpm test`.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback: re-runs the gate on any ref. A dispatch on a branch never
  # satisfies the tag guard below, so it publishes nothing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A release is never superseded: let an in-flight publish finish rather than
  # cancelling it halfway through an upload.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `env` at job level so the publish step's `if` can see the secret's
    # presence; step-level `env` is not in scope for that step's own `if`.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes an .npmrc that reads the auth token from NODE_AUTH_TOKEN,
          # which every package manager in the runner then honours.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate, exactly as CI runs it. `pnpm publish` also triggers the
      # package's own `prepublishOnly: pnpm check`, so this is belt-and-braces:
      # a red gate is reported before the tag is ever considered.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm
        # Two guards: the ref must be a version tag, and NPM_TOKEN must exist.
        # Without the token the step is skipped rather than failing the run,
        # which keeps a fork or a token-less environment usable as a dry run.
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
