# Release: verify, publish to npm, and open a GitHub Release.
#
# ---------------------------------------------------------------------------
# Triggering
#
#   * Pushing a `v*` tag performs a real release.
#   * `workflow_dispatch` is a rehearsal: it runs the identical gate, packs the
#     real tarball and exercises `npm publish --dry-run`, but every publish and
#     release step requires a tag ref and is therefore unreachable.
#
# Releasing is a two-command operation:
#
#   pnpm version patch        # or minor / major; writes the commit and the tag
#   git push --follow-tags
#
# The version in `package.json` and the tag name are checked against each other
# before anything is uploaded, because npm refuses to reuse a version and a
# mismatch would otherwise surface only after the release commit was public.
#
# ---------------------------------------------------------------------------
# Authentication: trusted publishing first, token as fallback
#
# The account that owns this package requires two-factor authentication for
# write actions. That matters more than it looks: a granular access token
# created without "Bypass 2FA" is refused at publish time with
# `ERR_PNPM_OTP_NON_INTERACTIVE`, because the registry asks for a one-time
# password that a runner cannot supply. Loosening the account's 2FA policy to
# work around that is the wrong trade.
#
# So the primary path is npm **trusted publishing**: GitHub mints an OIDC token
# for this workflow, npm exchanges it for a short-lived publish credential, and
# no long-lived secret exists anywhere. Configure it once with:
#
#   npm trust github devenv-cleaner \
#     --file release.yml --repo <owner>/<repo> --allow-publish
#
# That command modifies account settings, so npm asks the maintainer to
# authenticate in a browser once; it cannot be run unattended.
#
# If `NPM_TOKEN` is present the token path is used instead, which keeps a fork
# or a not-yet-configured repository working. The two publish steps are mutually
# exclusive, so a token never shadows trusted publishing and vice versa.
#
# ---------------------------------------------------------------------------
# Provenance
#
# `--provenance` attaches a signed attestation linking the tarball to this
# commit and this workflow, which is what lets a consumer run
# `npm audit signatures`. It requires `id-token: write` and a `repository` field
# in `package.json`; both are present.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Rehearsal only. A dispatch on a branch never satisfies the tag guard, so it
  # runs every other step for real and publishes nothing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A release is never superseded: cancelling a publish midway could leave the
  # registry holding a partially uploaded tarball.
  cancel-in-progress: false

permissions:
  # `contents: write` creates the GitHub Release; `id-token: write` mints the
  # OIDC token used for both trusted publishing and the provenance attestation.
  contents: write
  id-token: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level `env` so the publish steps' `if` can see whether the fallback
    # secret exists; step-level `env` is not in scope for that step's own
    # condition.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history and tags: the GitHub Release notes are generated from
          # the commits since the previous tag.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Deliberately no `registry-url`: that input writes an .npmrc holding
          # `_authToken=${NODE_AUTH_TOKEN}`. With trusted publishing there is no
          # token, and an empty one in the config makes npm prefer the empty
          # bearer credential over the OIDC exchange. Each publish step below
          # configures its own authentication instead.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Gate: the same commands CI runs, so a red build is reported before the
      # release is considered rather than halfway through an upload.
      # ---------------------------------------------------------------------
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify the publishable artifact
        run: pnpm verify:package

      # ---------------------------------------------------------------------
      # Tag and version must agree.
      # ---------------------------------------------------------------------
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # Rehearsal: exercise the exact packaging path without uploading.
      # ---------------------------------------------------------------------
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm publish --dry-run --no-git-checks

      # ---------------------------------------------------------------------
      # Publish. Exactly one of the next two steps runs.
      # ---------------------------------------------------------------------

      - name: Publish to npm (trusted publishing)
        id: publish-oidc
        # Preferred path, taken when no fallback token is configured. pnpm
        # detects the OIDC environment and exchanges the GitHub-issued token for
        # a short-lived publish credential, so nothing long-lived is involved.
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN == ''
        # The failure is captured rather than surfaced raw so the next step can
        # translate it into the one action a maintainer has to take; a bare
        # registry error in a long job log reads as a tool bug.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm publish --access public --no-git-checks --provenance 2>&1 | tee "${RUNNER_TEMP}/publish.log"

      - name: Publish to npm (access token)
        id: publish-token
        # Fallback for a repository that has not configured trusted publishing.
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        continue-on-error: true
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          # Written here rather than by `setup-node` so the credential is in
          # scope for this step only, and so it cannot shadow the OIDC exchange
          # the step above depends on.
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc" \
            pnpm publish --access public --no-git-checks --provenance 2>&1 | tee "${RUNNER_TEMP}/publish.log"

      # ---------------------------------------------------------------------
      # Diagnostics: turn a raw failure into the action that fixes it.
      # ---------------------------------------------------------------------
      - name: Explain a failed publish
        if: steps.publish-oidc.outcome == 'failure' || steps.publish-token.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/publish.log"

          if grep -q 'ERR_PNPM_OTP_NON_INTERACTIVE' "$log"; then
            {
              echo "### Publish blocked by two-factor authentication"
              echo
              echo "\`NPM_TOKEN\` has \`bypass_2fa: false\` while the account requires 2FA for"
              echo "writes, so the registry asked for a one-time password that CI cannot supply."
              echo
              echo "**Fix (choose one):**"
              echo
              echo "1. Preferred: configure trusted publishing, then delete the \`NPM_TOKEN\`"
              echo "   secret — no credential is needed at all:"
              echo '   ```'
              echo "   npm trust github devenv-cleaner --file release.yml \\"
              echo "     --repo ${{ github.repository }} --allow-publish"
              echo '   ```'
              echo "2. Or create a token that may bypass 2FA (granular with **Bypass 2FA**,"
              echo "   or Classic → **Automation**) and update the \`NPM_TOKEN\` secret."
              echo
              echo "No new tag is needed: re-run this job once the credential is in place."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::npm requires a one-time password. See the job summary for the two fixes."
          elif grep -q 'ERR_PNPM_AUTH_TOKEN_EXCHANGE' "$log"; then
            {
              echo "### Trusted publishing is not configured for this package"
              echo
              echo "The OIDC token exchange was refused, which means npm does not yet trust"
              echo "this repository and workflow. Configure it once — npm asks the maintainer"
              echo "to authenticate in a browser, so it cannot run unattended:"
              echo '```'
              echo "npm trust github devenv-cleaner --file release.yml \\"
              echo "  --repo ${{ github.repository }} --allow-publish"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::trusted publishing is not configured. See the job summary."
          elif grep -qE 'E402|E403|E404' "$log"; then
            echo "::error::the registry rejected the publish (package permissions or name). See the job log."
          else
            echo "::error::the publish failed for a reason not covered by the known cases; see the job log."
          fi
          exit 1

      - name: Note a skipped publish
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          steps.publish-oidc.outcome == 'skipped' &&
          steps.publish-token.outcome == 'skipped'
        run: |
          echo "::warning::no publish path was available; the artifact was verified but not published."
          echo "Configure trusted publishing or set the NPM_TOKEN secret, then re-run." >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Prove the registry actually serves what was just uploaded. Propagation
      # is usually fast but not instant, so this retries rather than flaking.
      # ---------------------------------------------------------------------
      - name: Verify the published version is fetchable
        # `outcome`, not `conclusion`: `continue-on-error` above reports the
        # conclusion as a success even when the publish itself failed, so
        # checking the conclusion would query the registry for a version that
        # was never uploaded.
        if: steps.publish-oidc.outcome == 'success' || steps.publish-token.outcome == 'success'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "devenv-cleaner@${version}" version 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              echo "registry serves devenv-cleaner@$version"
              exit 0
            fi
            echo "attempt $attempt: registry has not caught up yet"
            sleep 10
          done
          echo "::error::devenv-cleaner@$version was not retrievable from the registry"
          exit 1

      # ---------------------------------------------------------------------
      # GitHub Release, with the exact tarball npm received attached.
      # ---------------------------------------------------------------------
      - name: Pack the release tarball
        # Gated on the publish, not just on the tag: an explicit `if` replaces
        # the implicit "previous steps succeeded" guard, so tagging alone would
        # announce a release for a version npm never received.
        if: steps.publish-oidc.outcome == 'success' || steps.publish-token.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --pack-destination artifacts >/dev/null
          ls -l artifacts

      - name: Create the GitHub Release
        if: steps.publish-oidc.outcome == 'success' || steps.publish-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            artifacts/*.tgz
