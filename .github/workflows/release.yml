# Release: verify, publish to npm, and open a GitHub Release.
#
# ---------------------------------------------------------------------------
# Triggering
#
#   * Pushing a `v*` tag performs a real release.
#   * `workflow_dispatch` is a rehearsal: it runs the identical gate, packs the
#     real tarball and exercises `npm publish --dry-run`, but the publish and
#     release steps are unreachable because they require a tag ref.
#
# Releasing is therefore a two-command operation:
#
#   pnpm version patch        # or minor / major; writes the commit and the tag
#   git push --follow-tags
#
# The version in `package.json` and the tag name are checked against each other
# before anything is uploaded, because npm refuses to reuse a version and a
# mismatch would only surface after the release commit was already public.
#
# ---------------------------------------------------------------------------
# Authentication
#
# `NPM_TOKEN` is an npm automation/granular token with publish rights on
# `devenv-cleaner`, stored as a repository secret. `setup-node` writes an
# `.npmrc` that reads it from `NODE_AUTH_TOKEN`, so no token is ever echoed into
# the log or written into the workspace.
#
# Prefer trusted publishing once it is configured: add this repository and the
# `release.yml` filename as a trusted publisher on npmjs.com, then delete the
# `NPM_TOKEN` secret and the `NODE_AUTH_TOKEN` line below. With OIDC no
# long-lived credential exists to leak, and provenance is still produced.
#
# ---------------------------------------------------------------------------
# Provenance
#
# `--provenance` attaches a signed attestation linking the tarball to this
# commit and this workflow, which is what lets a consumer run
# `npm audit signatures`. It requires `id-token: write` and a `repository` field
# in `package.json`; both are present.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Rehearsal only. A dispatch on a branch never satisfies the tag guard, so it
  # cannot publish even though it runs every other step for real.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A release is never superseded: cancelling a publish midway could leave the
  # registry holding a partially uploaded tarball.
  cancel-in-progress: false

permissions:
  # `contents: write` creates the GitHub Release; `id-token: write` mints the
  # OIDC token npm exchanges for a provenance attestation.
  contents: write
  id-token: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level `env` so the publish step's `if` can see whether the secret
    # exists; step-level `env` is not in scope for that step's own condition.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history and tags: the GitHub Release notes are generated from
          # the commits since the previous tag.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes an .npmrc whose auth token is read from NODE_AUTH_TOKEN.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Gate: the same commands CI runs, so a red build is reported before the
      # release is considered rather than halfway through an upload.
      # ---------------------------------------------------------------------
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify the publishable artifact
        run: pnpm verify:package

      # ---------------------------------------------------------------------
      # Tag and version must agree.
      # ---------------------------------------------------------------------
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_ENV"
          echo "### Release v$pkg_version" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Rehearsal: exercise the exact packaging path without uploading.
      # ---------------------------------------------------------------------
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm publish --dry-run --no-git-checks

      # ---------------------------------------------------------------------
      # The real release.
      # ---------------------------------------------------------------------
      - name: Publish to npm
        id: publish
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        # The failure is captured rather than surfaced raw so the next step can
        # translate it into the one action a maintainer has to take. A bare
        # `ERR_PNPM_OTP_NON_INTERACTIVE` in a 2000-line job log reads as a tool
        # bug; it is actually an account setting.
        continue-on-error: true
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          pnpm publish --access public --no-git-checks --provenance 2>&1 | tee "${RUNNER_TEMP}/publish.log"

      - name: Explain a failed publish
        if: steps.publish.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/publish.log"

          if grep -q 'ERR_PNPM_OTP_NON_INTERACTIVE' "$log"; then
            {
              echo "### Publish blocked by two-factor authentication"
              echo
              echo "\`NPM_TOKEN\` is a token with \`bypass_2fa: false\`, and the npm account requires"
              echo "2FA for writes, so the registry asked for a one-time password that CI cannot supply."
              echo
              echo "**Fix (choose one):**"
              echo
              echo "1. Create a token that may bypass 2FA — npmjs.com → Access Tokens →"
              echo "   Generate New Token → **Granular**, with **Bypass 2FA** enabled"
              echo "   (a Classic **Automation** token also bypasses 2FA) — then update the"
              echo "   \`NPM_TOKEN\` secret and re-run this job. No new tag is needed."
              echo "2. Configure npm **trusted publishing** for this repository and"
              echo "   \`release.yml\`; then no token exists to configure at all."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::npm requires a one-time password (token has bypass_2fa: false). See the job summary for the two fixes."
          elif grep -qE 'E401|E403|ERR_PNPM_AUTH' "$log"; then
            echo "::error::npm rejected the credentials or the token lacks publish rights on this package. See the job log."
          else
            echo "::error::the publish failed for a reason not covered by the known cases; see the job log."
          fi
          exit 1

      - name: Note a skipped publish
        if: steps.publish.outcome == 'skipped'
        run: |
          echo "::warning::NPM_TOKEN is not set; the artifact was verified but not published."
          echo "Add the repository secret, then re-run this workflow or push a new tag." >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Prove the registry actually serves what was just uploaded. Propagation
      # is usually fast but not instant, so this retries rather than flaking.
      # ---------------------------------------------------------------------
      - name: Verify the published version is fetchable
        # `outcome`, not `conclusion`: `continue-on-error` above reports the
        # conclusion as a success even when the publish itself failed, so
        # checking the conclusion would query the registry for a version that
        # was never uploaded.
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "devenv-cleaner@${version}" version 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              echo "registry serves devenv-cleaner@$version"
              exit 0
            fi
            echo "attempt $attempt: registry has not caught up yet"
            sleep 10
          done
          echo "::error::devenv-cleaner@$version was not retrievable from the registry"
          exit 1

      # ---------------------------------------------------------------------
      # GitHub Release, with the exact tarball npm received attached.
      # ---------------------------------------------------------------------
      - name: Pack the release tarball
        # Gated on the publish, not just on the tag: an explicit `if` replaces
        # the implicit "previous steps succeeded" guard, so tagging alone would
        # announce a release for a version npm never received.
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --pack-destination artifacts >/dev/null
          ls -l artifacts

      - name: Create the GitHub Release
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            artifacts/*.tgz
